<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şifre Sıfırlama | Grup1_AuthProject</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="auth-card">
    <div class="auth-header">
      <span class="badge">AUTH-3 • Şifre Sıfırlama</span>
      <h1>Şifrenizi Sıfırlayın</h1>
      <p>Kayıtlı e-posta adresinizi doğrulayıp yeni şifre belirleyin.</p>
    </div>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="resetEmail">E-posta Adresi</label>
        <input type="email" id="resetEmail" name="email" placeholder="ornek@isubu.edu.tr" required />
      </div>

      <div class="form-group">
        <label for="resetCode">Doğrulama Kodu</label>
        <input type="text" id="resetCode" name="resetCode" placeholder="6 haneli sıfırlama kodu" required />
      </div>

      <div class="form-group">
        <label for="newPassword">Yeni Şifre</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="En az 8 karakter" required />
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Yeni Şifre Tekrar</label>
        <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Yeni şifreyi tekrar girin" required />
      </div>

      <button type="submit" class="btn-primary">Şifreyi Güncelle</button>
      <div id="resetFeedback" class="feedback" role="alert"></div>
    </form>

    <div class="auth-footer">
      <a href="login.html">Giriş ekranına dön</a>
    </div>
  </main>

  <script>
    const resetForm = document.getElementById('resetForm');
    const resetFeedback = document.getElementById('resetFeedback');

    function showResetMessage(message, type) {
      resetFeedback.textContent = message;
      resetFeedback.className = 'feedback ' + type;
    }

    resetForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const email = document.getElementById('resetEmail').value.trim();
      const resetCode = document.getElementById('resetCode').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        return showResetMessage('Geçerli bir e-posta adresi giriniz.', 'error');
      }

      if (resetCode.length < 6) {
        return showResetMessage('Doğrulama kodu en az 6 karakter olmalıdır.', 'error');
      }

      if (newPassword.length < 8) {
        return showResetMessage('Yeni şifre en az 8 karakter olmalıdır.', 'error');
      }

      if (newPassword !== confirmNewPassword) {
        return showResetMessage('Yeni şifreler eşleşmiyor.', 'error');
      }

      showResetMessage('Şifre sıfırlama formu doğrulandı. Şifreniz güncellenebilir.', 'success');
    });
  </script>
</body>
</html>
